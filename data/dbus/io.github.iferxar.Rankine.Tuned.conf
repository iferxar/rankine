<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name; anyone may call it. Methods that change hardware
     will check polkit authorization themselves. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.iferxar.Rankine.Tuned"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.iferxar.Rankine.Tuned"
           send_interface="io.github.iferxar.Rankine.Tuned"/>
    <allow send_destination="io.github.iferxar.Rankine.Tuned"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.iferxar.Rankine.Tuned"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
