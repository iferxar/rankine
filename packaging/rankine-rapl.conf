# Lets unprivileged users read the CPU package energy counter, which Rankine
# turns into CPU power. Since Linux 5.10 it is root-only because of the
# PLATYPUS power side channel (CVE-2020-8694); enable it only if that
# trade-off is acceptable on this machine.
z /sys/devices/virtual/powercap/intel-rapl/intel-rapl:*/energy_uj 0444 - - -
